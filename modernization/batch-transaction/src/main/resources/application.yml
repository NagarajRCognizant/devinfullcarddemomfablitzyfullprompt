# Local-only configuration. The credentials below are dummy values for a locally started
# PostgreSQL container and must never be reused.
spring:
  application:
    name: carddemo-batch-transaction
  datasource:
    url: ${CARDDEMO_TRANSACTION_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo_transaction}
    username: ${CARDDEMO_TRANSACTION_DB_USER:carddemo}
    password: ${CARDDEMO_TRANSACTION_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # The transaction schema is owned by the transaction service; the jobs only read and write it.
    enabled: false
  batch:
    jdbc:
      # Framework infrastructure rather than converted business schema, so the framework creates it.
      initialize-schema: always
    job:
      # Each job is submitted by name, as its JCL job was, with
      # --spring.batch.job.enabled=true --spring.batch.job.name=postTransactionsJob
      enabled: false
  security:
    oauth2:
      client:
        provider:
          carddemo-realm:
            token-uri: ${KEYCLOAK_URL:http://localhost:8088}/realms/${KEYCLOAK_REALM:carddemo}/protocol/openid-connect/token
        registration:
          carddemo-transaction-svc:
            provider: carddemo-realm
            client-id: ${KEYCLOAK_CLIENT_ID:carddemo-transaction-svc}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: client_credentials

carddemo:
  transaction:
    account-service:
      base-url: ${CARDDEMO_ACCOUNT_SERVICE_URL:http://localhost:8080}
      connect-timeout-millis: 2000
      read-timeout-millis: 5000
    service-client:
      registration-id: carddemo-transaction-svc
  batch:
    transaction:
      input-directory: ${CARDDEMO_BATCH_INPUT_DIR:../../app/data/ASCII}
      output-directory: ${CARDDEMO_BATCH_OUTPUT_DIR:target/transaction-batch}
      daily-transaction-file: dailytran.txt
      reject-file: dalyrejs.txt
      report-file: tranrept.txt
      statement-file: stmtfile.txt
      statement-html-file: stmtfile.html
      migration-export-file: expfile.tran
      record-charset: ISO-8859-1
      chunk-size: 100
      cross-reference-page-size: 100

logging:
  level:
    com.carddemo: INFO
