# Identity service: sign-on and user administration, owner of the converted USRSEC data.
spring:
  application:
    name: carddemo-identity-service
  datasource:
    url: ${CARDDEMO_IDENTITY_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo_identity}
    username: ${CARDDEMO_IDENTITY_DB_USER:carddemo}
    password: ${CARDDEMO_IDENTITY_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        provider:
          # Named rather than discovered, so the service starts whether or not Keycloak is up yet.
          carddemo-realm:
            token-uri: ${KEYCLOAK_URL:http://localhost:8088}/realms/${KEYCLOAK_REALM:carddemo}/protocol/openid-connect/token
        registration:
          # The registration id is the client id the provisioning asks for its token as.
          carddemo-identity-admin:
            provider: carddemo-realm
            client-id: ${KEYCLOAK_CLIENT_ID:carddemo-identity-admin}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: client_credentials

server:
  port: ${CARDDEMO_IDENTITY_PORT:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

carddemo:
  security:
    # keycloak: the realm authenticates, with a second factor, and this service only provisions.
    # legacy: the pre-realm sign-on of COSGN00C, kept for the parity evidence of that screen only.
    mode: ${CARDDEMO_SECURITY_MODE:keycloak}
    token:
      # One realm for every service; the signing keys come from its JWKS, so no service holds a key.
      issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_URL:http://localhost:8088}/realms/${KEYCLOAK_REALM:carddemo}}
      # The issuer is what the tokens say and the browser reached; the keys are fetched on the address
      # this service can reach, which is the same thing wherever Keycloak has one address only.
      jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8088}/realms/${KEYCLOAK_REALM:carddemo}/protocol/openid-connect/certs
      clock-skew: ${CARDDEMO_TOKEN_CLOCK_SKEW_SECONDS:60}
      require-second-factor: ${CARDDEMO_TOKEN_REQUIRE_SECOND_FACTOR:true}
      audience: carddemo-identity-service
    jwt:
      # Read in legacy mode only. Local development value only; every deployment supplies its own.
      secret: ${CARDDEMO_JWT_SECRET:local-development-signing-key-change-me-0123456789}
      issuer: carddemo-identity-service
      ttl-minutes: ${CARDDEMO_JWT_TTL_MINUTES:30}
  keycloak:
    # The confidential client of this service; the secret is required, there is no default.
    server-url: ${KEYCLOAK_URL:http://localhost:8088}
    realm: ${KEYCLOAK_REALM:carddemo}
    client-id: ${KEYCLOAK_CLIENT_ID:carddemo-identity-admin}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    connect-timeout-millis: 2000
    read-timeout-millis: 5000
