# Integration test configuration. The database is the local carddemo_identity_test database created
# by modernization/scripts/local-db.sh; every test context cleans it and re-applies the migrations,
# so each class sees the ten records of the shipped USRSEC file.
spring:
  datasource:
    url: ${CARDDEMO_IDENTITY_TEST_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo_identity_test}
    username: ${CARDDEMO_IDENTITY_TEST_DB_USER:carddemo}
    password: ${CARDDEMO_IDENTITY_TEST_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

carddemo:
  security:
    # The COBOL parity suite exercises the sign-on and user administration screens exactly as the
    # programs behaved, which is the legacy mode; the realm behaviour has its own tests, each of which
    # sets the mode back to keycloak and supplies an issuer.
    mode: legacy
    jwt:
      secret: test-only-signing-key-0123456789-0123456789
      issuer: carddemo-identity-service
      ttl-minutes: 30
