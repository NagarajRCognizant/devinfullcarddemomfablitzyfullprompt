# Local-only configuration. Every credential here is a local development placeholder and must be
# supplied per environment; the transaction service owns carddemo_transaction and reaches account
# data only through the account service API.
spring:
  application:
    name: carddemo-transaction-service
  datasource:
    url: ${CARDDEMO_TRANSACTION_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo_transaction}
    username: ${CARDDEMO_TRANSACTION_DB_USER:carddemo}
    password: ${CARDDEMO_TRANSACTION_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        provider:
          # Named rather than discovered so the service starts whether or not Keycloak is up yet.
          carddemo-realm:
            token-uri: ${KEYCLOAK_URL:http://localhost:8088}/realms/${KEYCLOAK_REALM:carddemo}/protocol/openid-connect/token
        registration:
          carddemo-transaction-svc:
            provider: carddemo-realm
            client-id: ${KEYCLOAK_CLIENT_ID:carddemo-transaction-svc}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: client_credentials

server:
  address: 127.0.0.1
  port: 8083

carddemo:
  security:
    token:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_URL:http://localhost:8088}/realms/${KEYCLOAK_REALM:carddemo}}
      jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8088}/realms/${KEYCLOAK_REALM:carddemo}/protocol/openid-connect/certs
      clock-skew: ${CARDDEMO_TOKEN_CLOCK_SKEW_SECONDS:60}
      require-second-factor: ${CARDDEMO_TOKEN_REQUIRE_SECOND_FACTOR:true}
      audience: carddemo-transaction-service
  transaction:
    account-service:
      base-url: ${CARDDEMO_ACCOUNT_SERVICE_URL:http://localhost:8080}
      connect-timeout-millis: 2000
      read-timeout-millis: 5000
    service-client:
      registration-id: carddemo-transaction-svc

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.carddemo: INFO
