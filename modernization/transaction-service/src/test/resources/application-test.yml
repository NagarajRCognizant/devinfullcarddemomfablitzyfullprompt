# Integration test configuration. The database is the local carddemo_transaction_test database
# created by modernization/scripts/local-db.sh; every test context cleans it and re-applies the
# migrations, which loads the same sample data the IDCAMS REPRO steps loaded.
spring:
  datasource:
    url: ${CARDDEMO_TRANSACTION_TEST_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo_transaction_test}
    username: ${CARDDEMO_TEST_DB_USER:carddemo}
    password: ${CARDDEMO_TEST_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
  security:
    oauth2:
      client:
        provider:
          carddemo-realm:
            token-uri: http://localhost:8088/realms/carddemo/protocol/openid-connect/token
        registration:
          carddemo-transaction-svc:
            provider: carddemo-realm
            client-id: carddemo-transaction-svc
            client-secret: test-only-secret
            authorization-grant-type: client_credentials

carddemo:
  security:
    token:
      issuer-uri: http://localhost:8088/realms/carddemo
      jwk-set-uri: http://localhost:8088/realms/carddemo/protocol/openid-connect/certs
      audience: carddemo-transaction-service
      require-second-factor: false
