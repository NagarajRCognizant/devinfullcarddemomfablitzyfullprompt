# The scheme the browser used, which is the one an outer proxy reports and only otherwise the one
# this server was reached on.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    "~^(?<first>[^,\s]+)" $first;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Same-origin access to the converted REST API through the gateway, matching the Vite dev server
    # proxy: the browser never addresses a service directly, as the terminal never addressed a
    # program directly.
    location /api/ {
        proxy_pass http://gateway:8090;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass http://gateway:8090;
    }

    # The realm on the same origin as the page, for a browser that is not on the Docker host: it can
    # then reach the sign-on, the TOTP prompt and the enrolment pages, and the SPA can read the
    # discovery document, without a second address of its own. A browser on the host does not need
    # this and keeps using the published Keycloak port.
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
