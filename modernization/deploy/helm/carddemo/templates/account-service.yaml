{{- if .Values.accountService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carddemo.fullname" . }}-account-service
  labels:
    {{- include "carddemo.labels" . | nindent 4 }}
    app.kubernetes.io/component: account-service
spec:
  replicas: {{ .Values.accountService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: account-service
  template:
    metadata:
      labels:
        {{- include "carddemo.labels" . | nindent 8 }}
        app.kubernetes.io/component: account-service
    spec:
      containers:
        # COACTVWC and COACTUPC: account view and account update.
        - name: account-service
          image: {{ include "carddemo.image" (dict "root" . "component" .Values.accountService) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.accountService.port }}
          env:
            {{- include "carddemo.serviceEnv" (dict "root" . "component" .Values.accountService) | nindent 12 }}
          {{- include "carddemo.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.accountService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carddemo.fullname" . }}-account-service
  labels:
    {{- include "carddemo.labels" . | nindent 4 }}
    app.kubernetes.io/component: account-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.accountService.port }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: account-service
{{- end }}
