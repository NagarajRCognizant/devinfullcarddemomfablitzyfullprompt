{{- if .Values.transactionService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carddemo.fullname" . }}-transaction-service
  labels:
    {{- include "carddemo.labels" . | nindent 4 }}
    app.kubernetes.io/component: transaction-service
spec:
  replicas: {{ .Values.transactionService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: transaction-service
  template:
    metadata:
      labels:
        {{- include "carddemo.labels" . | nindent 8 }}
        app.kubernetes.io/component: transaction-service
    spec:
      containers:
        # COTRN00C, COTRN01C and COTRN02C: the transaction list, view and add screens; COBIL00C: the
        # bill payment; CORPT00C: the report request.
        - name: transaction-service
          image: {{ include "carddemo.image" (dict "root" . "component" .Values.transactionService) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.transactionService.port }}
          env:
            {{- include "carddemo.serviceEnv" (dict "root" . "component" .Values.transactionService) | nindent 12 }}
            # The balance the bill payment adjusts belongs to the account context, so it is reached
            # over its API rather than in the same unit of recovery COBIL00C had.
            - name: CARDDEMO_ACCOUNT_SERVICE_URL
              value: http://{{ include "carddemo.fullname" . }}-account-service:{{ .Values.accountService.port }}
          {{- include "carddemo.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.transactionService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carddemo.fullname" . }}-transaction-service
  labels:
    {{- include "carddemo.labels" . | nindent 4 }}
    app.kubernetes.io/component: transaction-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.transactionService.port }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: transaction-service
{{- end }}
