# Integration test configuration. The database is the local carddemo_test database created by
# modernization/scripts/local-db.sh; every test context cleans it and re-applies the migrations.
spring:
  datasource:
    url: ${CARDDEMO_TEST_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo_test}
    username: ${CARDDEMO_TEST_DB_USER:carddemo}
    password: ${CARDDEMO_TEST_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

carddemo:
  security:
    jwt:
      secret: test-only-signing-key-0123456789-0123456789
      issuer: carddemo-identity-service
