# Local-only configuration. Every value here is a local development placeholder: the credentials
# below are dummy values for a locally started PostgreSQL container and must never be reused.
spring:
  application:
    name: carddemo-account-service
  datasource:
    url: ${CARDDEMO_ACCOUNT_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${CARDDEMO_ACCOUNT_DB_USER:carddemo}
    password: ${CARDDEMO_ACCOUNT_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 127.0.0.1
  port: 8080

carddemo:
  security:
    token:
      # One realm for every service; the signing keys come from its JWKS, so no service holds a key.
      issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_URL:http://localhost:8088}/realms/${KEYCLOAK_REALM:carddemo}}
      # The issuer is what the tokens say and the browser reached; the keys are fetched on the address
      # this service can reach, which is the same thing wherever Keycloak has one address only.
      jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8088}/realms/${KEYCLOAK_REALM:carddemo}/protocol/openid-connect/certs
      clock-skew: ${CARDDEMO_TOKEN_CLOCK_SKEW_SECONDS:60}
      require-second-factor: ${CARDDEMO_TOKEN_REQUIRE_SECOND_FACTOR:true}
      # Added to the token by the realm audience mapper; a token minted for another service is refused.
      audience: carddemo-account-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.carddemo: INFO
