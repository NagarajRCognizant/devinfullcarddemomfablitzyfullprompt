# Integration test configuration. The database is the local carddemo_authorization_test database;
# every test context cleans it and re-applies the authorization service migrations that are copied
# onto the test classpath by the build.
spring:
  datasource:
    url: ${CARDDEMO_AUTHORIZATION_TEST_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo_authorization_test}
    username: ${CARDDEMO_TEST_DB_USER:carddemo}
    password: ${CARDDEMO_TEST_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

carddemo:
  batch:
    authpurge:
      expiry-days: 5
      checkpoint-frequency: 2
      checkpoint-display-frequency: 1
      debug: true
      persist-summary-adjustments: true
