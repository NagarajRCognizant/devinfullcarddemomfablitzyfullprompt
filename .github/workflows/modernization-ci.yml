# Continuous integration for the converted CardDemo account management, user administration,
# credit card authorization and transaction capabilities under modernization/.
#
# Each service owns its data, so the job that runs their tests gets one database per service, as the
# deployment gives each service its own PostgreSQL instance. The authorization messaging tests use
# an embedded Kafka broker, so no broker service is needed here.
name: Modernization CI

on:
  push:
    branches: [main]
    paths: ['modernization/**', '.github/workflows/modernization-ci.yml']
  pull_request:
    paths: ['modernization/**', '.github/workflows/modernization-ci.yml']

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    services:
      account-db:
        image: postgres:16
        env:
          POSTGRES_DB: carddemo_test
          POSTGRES_USER: carddemo
          POSTGRES_PASSWORD: carddemo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carddemo -d carddemo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      identity-db:
        image: postgres:16
        env:
          POSTGRES_DB: carddemo_identity_test
          POSTGRES_USER: carddemo
          POSTGRES_PASSWORD: carddemo
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U carddemo -d carddemo_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      authorization-db:
        image: postgres:16
        env:
          POSTGRES_DB: carddemo_authorization_test
          POSTGRES_USER: carddemo
          POSTGRES_PASSWORD: carddemo
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U carddemo -d carddemo_authorization_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      transaction-db:
        image: postgres:16
        env:
          POSTGRES_DB: carddemo_transaction_test
          POSTGRES_USER: carddemo
          POSTGRES_PASSWORD: carddemo
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U carddemo -d carddemo_transaction_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARDDEMO_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/carddemo_test
      CARDDEMO_TEST_DB_USER: carddemo
      CARDDEMO_TEST_DB_PASSWORD: carddemo
      CARDDEMO_IDENTITY_TEST_JDBC_URL: jdbc:postgresql://localhost:5433/carddemo_identity_test
      CARDDEMO_IDENTITY_TEST_DB_USER: carddemo
      CARDDEMO_IDENTITY_TEST_DB_PASSWORD: carddemo
      CARDDEMO_AUTHORIZATION_TEST_JDBC_URL: jdbc:postgresql://localhost:5434/carddemo_authorization_test
      CARDDEMO_TRANSACTION_TEST_JDBC_URL: jdbc:postgresql://localhost:5435/carddemo_transaction_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify runs the JaCoCo gates on the converted business logic as well as the tests.
      - run: mvn -B -f modernization/pom.xml clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: modernization/**/target/surefire-reports/**
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernization/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: modernization/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  contracts:
    name: OpenAPI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes @redocly/cli@1.25.11 lint
        working-directory: modernization

  charts:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint modernization/deploy/helm/carddemo
      - run: helm template modernization/deploy/helm/carddemo --set jwt.secret=ci-only > /dev/null
